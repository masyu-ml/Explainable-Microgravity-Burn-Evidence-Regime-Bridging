name: Research reference checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  synthetic-gower-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test documented retrieval example
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: python examples/gower_demo.py
